version: '3.8'

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bugpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bugpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bugpilot_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-bugpilot_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bugpilot} -d ${POSTGRES_DB:-bugpilot_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache & Queue ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bugpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO S3-Compatible Storage ──────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: bugpilot-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secure_key}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── BugPilot Backend API (NestJS) ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bugpilot-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-bugpilot}:${POSTGRES_PASSWORD:-bugpilot_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-bugpilot_db}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-bugpilot-media}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secure_key}
      JWT_SECRET: ${JWT_SECRET:-super_secret_enterprise_jwt_token_2026}
    ports:
      - "4000:4000"

  # ── BugPilot Platform Web Dashboard (Next.js) ─────────────────────────
  platform:
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: bugpilot-platform
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
